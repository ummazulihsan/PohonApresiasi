<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BERARTI - Berbagi Apresiasi dari Hati</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --leaf-green: #2d6a4f;
            --apple-red: #e63946;
            --sky-top: #a2d2ff;
            --sky-bottom: #caf0f8;
            --grass-green: #70e000;
            --trunk-brown: #5d4037;
            --white-glass: rgba(255, 255, 255, 0.85);
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        /* --- STYLE UNTUK SEARCH & FILTER --- */
        .search-wrapper { 
            width: 100%; 
            max-width: 600px; 
            margin-bottom: 20px; 
            display: flex;
            gap: 10px;
            position: relative; 
            z-index: 150;
        }
        .search-input { 
            width: 100%; 
            padding: 12px 40px 12px 15px; 
            border-radius: 25px; 
            border: 2px solid var(--leaf-green); 
            outline: none; 
            box-shadow: var(--shadow); 
            font-size: 1rem; 
        }
        .search-container-inner { position: relative; flex: 1; }
        .search-container-inner i { 
            position: absolute; 
            right: 15px; 
            top: 15px; 
            color: var(--leaf-green); 
        }

        .autocomplete-input {
            width: 100%; 
            padding: 14px; 
            border: 2px solid #ddd; 
            border-radius: 12px; 
            font-size: 15px; 
            outline: none; 
            background: white; 
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        .autocomplete-input:focus {
            border-color: var(--leaf-green);
        }
        
        /* Efek Apel / Durian */
        .apple-wrapper { transition: all 0.4s ease; z-index: 10; }
        .apple-wrapper.highlight { 
            transform: translate(-50%, -50%) scale(1.8) !important; 
            z-index: 100 !important; 
            filter: drop-shadow(0 0 15px gold) !important; 
        }
        .apple-wrapper.fade { 
            opacity: 0.1 !important; 
            transform: translate(-50%, -50%) scale(0.6) !important; 
            pointer-events: none; 
        }

        /* --- BASE LAYOUT --- */
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .main-content { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; width: 100%; }

        header {
            width: 100%; text-align: center; padding: 30px 20px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255,255,255,0.3); box-sizing: border-box;
        }
        .app-title { color: var(--leaf-green); font-size: 2.8rem; font-weight: 900; margin: 0; text-shadow: 2px 2px white; }
        .app-subtitle { color: #555; font-size: 1rem; font-weight: 600; margin: 0 0 15px 0; }
        
        .tab-bar { background: var(--leaf-green); display: flex; justify-content: center; position: sticky; top: 0; z-index: 100; width: 100%; }
        .tab-btn { padding: 18px 25px; border: none; background: none; color: rgba(255,255,255,0.7); cursor: pointer; font-weight: bold; transition: 0.3s; position: relative; }
        .tab-btn.active { color: white; }
        .tab-btn.active::after { content: ''; display: block; width: 100%; height: 4px; background: var(--grass-green); position: absolute; bottom: 0; left: 0; }

        .page { display: none; padding: 30px 20px; flex-direction: column; align-items: center; width: 100%; max-width: 1200px; box-sizing: border-box; }
        .page.active { display: flex; }

        /* DASHBOARD STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; width: 100%; max-width: 700px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: var(--shadow); transition: transform 0.3s;}
        .stat-card:hover { transform: translateY(-5px); }
        .stat-value { display: block; font-size: 2.2rem; font-weight: 900; color: var(--leaf-green); }

        .leaderboard { background: white; width: 100%; max-width: 700px; border-radius: 25px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 20px; box-sizing: border-box; }
        .leader-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .leader-count { background: #f0fdf4; color: var(--leaf-green); padding: 5px 12px; border-radius: 15px; font-weight: bold; }

         /* --- TAB 2: INPUT FORM --- */
        .card { background: var(--white-glass); padding: 40px; border-radius: 25px; width: 100%; max-width: 480px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px); box-sizing: border-box; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--leaf-green); }
        .card select, .card textarea { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; background: white; box-sizing: border-box; }
        .card select:focus, .card textarea:focus { border-color: var(--leaf-green); }
        .btn { background: var(--leaf-green); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #22523c; }

        /* TREE */
        #tree-container { position: relative; width: 100%; max-width: 900px; height: 500px; margin-top: 20px; }
        #apples-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        .apple-wrapper { position: absolute; transform: translate(-50%, -50%); cursor: pointer; text-align: center; }
        .apple-name { position: absolute; color: white; font-weight: bold; font-size: 9px; top: 38%; width: 85%; left: 50%; transform: translate(-50%, -50%); text-shadow: 1px 1px 3px black; pointer-events: none; }

        footer { flex-shrink: 0; width: 100%; padding: 30px 20px; text-align: center; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border-top: 1px solid rgba(255, 255, 255, 0.3); color: var(--leaf-green); box-sizing: border-box; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-card { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 25px; max-height: 70vh; overflow-y: auto; }
        .msg-bubble { background: #f8fdfa; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--apple-red); font-style: italic; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="rimbun-kebaikan.mp3" type="audio/mpeg"></audio>

    <div id="music-control" onclick="toggleMusic()" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: white; padding: 10px; border-radius: 50%; cursor: pointer; box-shadow: var(--shadow); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
        <i id="music-icon" class="fas fa-volume-mute" style="color: var(--leaf-green);"></i>
    </div>

    <div class="main-content">
        <header>
            <h1 class="app-title">BERARTI</h1>
            <p class="app-subtitle">(Berbagi Apresiasi dari Hati)</p>
            <p style="font-style: italic; color: #666; max-width: 600px; margin: 0 auto;">"Kebaikan yang terus bertumbuh akan selalu menemukan jalannya."</p>
        </header>

        <nav class="tab-bar">
            <button class="tab-btn active" onclick="showTab('page-dash', this)">Dashboard</button>
            <button class="tab-btn" onclick="showTab('page-input', this)">Beri Apresiasi</button>
            <button class="tab-btn" onclick="showTab('page-tree', this)">Pohon Kebaikan</button>
        </nav>

        <!-- PAGE 1: DASHBOARD -->
        <div id="page-dash" class="page active">
            <select id="dash-tw-selector" onchange="processDashboard(this.value)" style="margin-bottom: 20px; padding: 10px; border-radius: 20px; border: 2px solid var(--leaf-green); font-weight: bold;">
                <option value="all">Semua Triwulan</option>
                <option value="1">Triwulan 1</option>
                <option value="2">Triwulan 2</option>
                <option value="3">Triwulan 3</option>
                <option value="4">Triwulan 4</option>
            </select>
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-value" id="s-pgr">0</span>Pengirim</div>
                <div class="stat-card"><span class="stat-value" id="s-pnr">0</span>Penerima</div>
                <div class="stat-card"><span class="stat-value" id="s-total">0</span>Ucapan</div>
            </div>
            <div class="leaderboard"><h3>🏆 Top 5 Penerima</h3><div id="leaderboard-penerima"></div></div>
            <div class="leaderboard"><h3>🌟 Top 5 Pengirim</h3><div id="leaderboard-pengirim"></div></div>
        </div>

        <!-- PAGE 2: INPUT FORM -->
        <div id="page-input" class="page">
            <div class="card">
                <h2 style="color: var(--leaf-green); text-align: center; margin-top: 0; margin-bottom: 25px;"><i class="fas fa-heart"></i> Kirim Apresiasi</h2>
                
                <div>
                    <div class="input-group">
                    <label>Namamu (Pengirim)</label>
                    <input list="list-karyawan" id="in-pengirim" placeholder="Ketik namamu..." class="autocomplete-input">
                    </div>
                    <div class="input-group">
                    <label>Untuk Siapa? (Penerima)</label>
                    <input list="list-karyawan" id="in-penerima" placeholder="Cari nama penerima..." class="autocomplete-input">
                    </div>
                    <datalist id="list-karyawan">
                    </datalist>
        
                    <div class="input-group">
                        <label>Apresiasi Tulusmu</label>
                        <textarea id="in-pesan" rows="5" placeholder="Tuliskan hal baik atau ucapan terima kasihmu di sini..."></textarea>
                    </div>
                    <button class="btn" onclick="submitApresiasi()">Gantungkan di Pohon!</button>
                    <div id="status" style="margin-top:15px; text-align:center; font-weight:bold; color: var(--leaf-green);"></div>
                </div>
            </div>
        </div>

        <!-- PAGE 3: POHON (ADAPTIF TRIWULAN) -->
        <div id="page-tree" class="page">
            <div class="search-wrapper">
                <select id="tw-selector" onchange="renderTree()" style="padding: 10px; border-radius: 25px; border: 2px solid var(--leaf-green); outline: none; font-weight: bold; cursor: pointer;">
                    <option value="1">Pohon TW 1 (Apel)</option>
                    <option value="2">Pohon TW 2 (Durian)</option>
                    <option value="3">Pohon TW 3 </option>
                    <option value="4">Pohon TW 4 </option>
                </select>
                <div class="search-container-inner">
                    <input type="text" id="tree-search" class="search-input" placeholder="Cari nama..." oninput="searchApple()">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <h3 id="current-tw-title" style="color: var(--leaf-green); margin: 10px 0;">Pohon Triwulan 1</h3>
            <div id="tree-container">
                <svg id="dynamic-tree" viewBox="0 0 500 500" style="width:100%; height:100%; transition: 1s;">
                    <path d="M230,500 L270,500 L260,350 L240,350 Z" fill="var(--trunk-brown)"/>
                    <g id="tree-branches" stroke="var(--trunk-brown)" stroke-width="8" fill="none"></g>
                    <g id="tree-leaves"></g>
                </svg>
                <div id="apples-layer"></div>
            </div>
        </div>
    </div>

    <footer>
        <p style="margin: 0; font-weight: 900; letter-spacing: 2px;">MENANAM KEBAIKAN BERSAMA</p>
        <p style="margin: 5px 0 0; font-size: 0.7rem; opacity: 0.6;">Tim CAN BPS Kep. Bangka Belitung © 2026</p>
    </footer>

    <div id="modal" onclick="this.style.display='none'">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 id="modal-title" style="color:var(--leaf-green); margin-top:0;"></h2>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzYHl6Es26hC0ACGFeAskdM7r_wmh_vjd_-vxR5GN9pjKvFfFXIteiivL_uQv53ht8z1g/exec';
        let allData = [];
        let daftarKaryawan = [];

        window.onload = () => {
            // Pasang default select TW berdasarkan bulan saat ini secara real-time
            const currentMonth = new Date().getMonth() + 1; // 1-12
            let currentTW = "1";
            if (currentMonth >= 4 && currentMonth <= 7) currentTW = "2";
            else if (currentMonth >= 8 && currentMonth <= 9) currentTW = "3";
            else if (currentMonth >= 10 && currentMonth <= 12) currentTW = "4";
            
            document.getElementById('tw-selector').value = currentTW;
            // Set ke dropdown Dashboard
            document.getElementById('dash-tw-selector').value = currentTW;
            refreshData();
        };

        function showTab(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
            if(pageId === 'page-tree') renderTree();
        }

        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('music-icon');
        
        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); musicIcon.classList.replace('fa-volume-mute', 'fa-volume-up'); }
            else { bgMusic.pause(); musicIcon.classList.replace('fa-volume-up', 'fa-volume-mute'); }
        }

        async function refreshData() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                allData = json.apresiasi || [];
                daftarKaryawan = json.karyawan || [];
                
                const list = json.karyawan || [];
                const datalist = document.getElementById('list-karyawan');
                
                if (list.length > 0 && datalist) {
                    // Kita buat string options sekali saja untuk efisiensi
                    const htmlOptions = list.map(n => `<option value="${n}">`).join('');
                    datalist.innerHTML = htmlOptions;
                }
                if (daftarKaryawan.length > 0 && datalist) {
                datalist.innerHTML = daftarKaryawan.map(n => `<option value="${n}">`).join('');
                    }
        
                processDashboard();
                if(document.getElementById('page-tree').classList.contains('active')) renderTree();
            } catch(e) { console.error("Gagal memuat data", e); }
        }

        function processDashboard(selectedTW = "all") {
                        if (!allData.length) return;
                    
                        // Filter data berdasarkan TW jika dipilih
                        let filteredData = allData;
                        if (selectedTW !== "all") {
                            filteredData = allData.filter(d => String(d.Triwulan || d.triwulan || "1") === String(selectedTW));
                        }
                    
                        const cPnr = {}, cPgr = {}, setPgr = new Set(), setPnr = new Set();
                        
                        filteredData.forEach(d => {
                            const pnr = d.Penerima || d.penerima;
                            const pgr = d.Pengirim || d.pengirim;
                            if(pnr) { setPnr.add(pnr); cPnr[pnr] = (cPnr[pnr] || 0) + 1; }
                            if(pgr) { setPgr.add(pgr); cPgr[pgr] = (cPgr[pgr] || 0) + 1; }
                        });
                    
                        document.getElementById('s-pgr').innerText = setPgr.size;
                        document.getElementById('s-pnr').innerText = setPnr.size;
                        document.getElementById('s-total').innerText = filteredData.length;
                    
                        const renderL = (obj, id, label) => {
                            const s = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0,5);
                            document.getElementById(id).innerHTML = s.length > 0 
                                ? s.map(i => `<div class="leader-item"><span>${i[0]}</span><span class="leader-count">${i[1]} ${label}</span></div>`).join('')
                                : '<div style="padding:10px; color:#888;">Belum ada data di periode ini.</div>';
                        };
                        
                        renderL(cPnr, 'leaderboard-penerima', 'Apresiasi');
                        renderL(cPgr, 'leaderboard-pengirim', 'Kiriman');
                    }

                 function getQuarter(dateString) {
                if (!dateString) return "1";
            
                // Ubah string menjadi objek Date agar JS yang menentukan bulan secara otomatis
                // Ini lebih aman daripada memotong string secara manual
                const date = new Date(dateString);
            
                // Cek jika format tanggal tidak valid
                if (isNaN(date.getTime())) {
                    // Jika gagal, coba cara manual (asumsi MM/DD/YYYY atau D/M/YYYY)
                    const parts = String(dateString).split(/[\/ -]/); // Split dengan / , spasi, atau -
                    // Jika elemen pertama > 12, kemungkinan itu DD/MM/YYYY, jadi bulan ada di index 1
                    const month = parseInt(parts[0], 10) > 12 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
                    
                    if (month >= 4 && month <= 7) return "2";
                    if (month >= 8 && month <= 9) return "3";
                    if (month >= 10 && month <= 12) return "4";
                    return "1";
                }
            
                // Jika valid, ambil bulan (0-11, jadi +1)
                const month = date.getMonth() + 1;
            
                if (month >= 4 && month <= 7) return "2";
                if (month >= 8 && month <= 9) return "3";
                if (month >= 10 && month <= 12) return "4";
                return "1";
            }

        function searchApple() {
            const q = document.getElementById('tree-search').value.toLowerCase().trim();
            document.querySelectorAll('.apple-wrapper').forEach(a => {
                const n = a.getAttribute('data-name').toLowerCase();
                if (q === "") a.classList.remove('highlight', 'fade');
                else if (n.includes(q)) { a.classList.add('highlight'); a.classList.remove('fade'); }
                else { a.classList.add('fade'); a.classList.remove('highlight'); }
            });
        }

       function renderTree() {
                const layer = document.getElementById('apples-layer');
                const branchGroup = document.getElementById('tree-branches');
                const leafGroup = document.getElementById('tree-leaves');
                const selTW = document.getElementById('tw-selector').value;
            
                // 1. Inisialisasi 'filtered' di sini, tepat sebelum digunakan
                const filtered = allData.filter(d => {
                    // Ambil data, pastikan handle case (huruf besar/kecil)
                    const tw = String(d.Triwulan || d.triwulan || "1"); 
                    return tw === selTW;
                });
            
                // Update Judul
                const namaBuah = selTW === "1" ? "Apel" : selTW === "2" ? "Durian" : selTW === "3" ? "Jeruk" : "Manggis";
                document.getElementById('current-tw-title').innerText = `Pohon Triwulan ${selTW} (${namaBuah})`;
                
                // Reset layar
                layer.innerHTML = ""; 
                branchGroup.innerHTML = ""; 
                leafGroup.innerHTML = "";
            
                // 2. Gunakan 'filtered' yang sudah aman di sini
                const levels = [
                    { d: "M250,380 L250,230", r: 90, c: "#1a4731" },
                    { d: "M250,330 Q160,280 130,310", r: 80, c: "#235e41" },
                    { d: "M250,330 Q340,280 370,310", r: 80, c: "#235e41" },
                    { d: "M250,250 Q180,180 200,120", r: 75, c: "#2f7d56" },
                    { d: "M250,250 Q320,180 300,120", r: 75, c: "#2f7d56" }
                ];
            
                const activeLeaves = [];
                const parts = filtered.length === 0 ? 3 : Math.min(levels.length, Math.floor(filtered.length / 2) + 2);
                
                for(let i = 0; i < parts; i++) {
                    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    p.setAttribute("d", levels[i].d); branchGroup.appendChild(p);
                    const coords = levels[i].d.split(/[MLQ, ]+/).filter(Boolean);
                    const cx = coords[coords.length - 2], cy = coords[coords.length - 1];
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", levels[i].r);
                    circle.setAttribute("fill", levels[i].c); leafGroup.appendChild(circle);
                    activeLeaves.push({x: parseFloat(cx), y: parseFloat(cy), r: levels[i].r});
                }
            
                if (filtered.length === 0) {
                    layer.innerHTML = `<div style="color: var(--leaf-green); margin-top: 200px; font-weight: bold; text-align:center; width:80%; max-width:400px; margin-left:auto; margin-right:auto; background: rgba(255,255,255,0.85); padding: 15px; border-radius: 15px; box-shadow: var(--shadow);">Belum ada buah ${namaBuah} yang tumbuh di TW ${selTW}.</div>`;
                    return;
                }
            
                // Lanjutkan render buah (logic yang sama seperti sebelumnya)...
                const treeGroups = {};
                filtered.forEach(d => { 
                    const p = d.Penerima || d.penerima;
                    if(!treeGroups[p]) treeGroups[p] = []; 
                    treeGroups[p].push(d); 
                });
            
                const placed = [];
                Object.keys(treeGroups).forEach(nama => {
                    const count = treeGroups[nama].length;
                    const size = Math.min(45 + (count * 5), 80);
                    let pos = null;
                    for(let attempt=0; attempt<50; attempt++) {
                        const leaf = activeLeaves[Math.floor(Math.random()*activeLeaves.length)];
                        const angle = Math.random()*Math.PI*2, rad = Math.random()*(leaf.r - 20);
                        const x = leaf.x + rad*Math.cos(angle), y = leaf.y + rad*Math.sin(angle);
                        if(!placed.some(p => Math.hypot(p.x-x, p.y-y) < 32)) { pos = {x,y}; break; }
                    }
                    if(!pos) pos = {x: 250, y: 250};
                    placed.push(pos);
            
                    const wrapper = document.createElement('div');
                    wrapper.className = 'apple-wrapper';
                    wrapper.setAttribute('data-name', nama);
                    wrapper.style.left = (pos.x/500*100)+'%';
                    wrapper.style.top = (pos.y/500*100)+'%';
            
                    let buahSvg = "";
                    if (selTW === "2") {
                        buahSvg = `
                            <svg width="${size}" height="${size}" viewBox="0 0 100 100">
                                <path d="M50,10 Q45,20 48,30" stroke="#5d4037" stroke-width="4" fill="none"/>
                                <path d="M50,25 C20,25 15,45 15,65 C15,85 35,95 50,95 C65,95 85,85 85,65 C85,45 80,25 50,25 Z" fill="#85933a"/>
                                <path d="M30,45 L25,50 L35,52 L30,58 L40,58 L35,68 L45,65 L43,75 L53,70 L55,80 L65,72 L68,80 L75,70 L78,60 L70,58 L72,48 L62,50 L60,40 L50,45 L48,35 Z" fill="#a3b14a"/>
                            </svg>
                        `;
                    } else if (selTW === "3") {
                        buahSvg = `
                            <svg width="${size}" height="${size}" viewBox="0 0 100 100">
                                <path d="M50,10 Q55,18 48,25" stroke="#5d4037" stroke-width="3" fill="none"/>
                                <circle cx="50" cy="58" r="35" fill="#f9844a"/>
                                <circle cx="50" cy="32" r="3" fill="#43aa8b"/>
                            </svg>
                        `;
                    } else if (selTW === "4") {
                        buahSvg = `
                            <svg width="${size}" height="${size}" viewBox="0 0 100 100">
                                <path d="M50,12 L50,25" stroke="#43281c" stroke-width="4" fill="none"/>
                                <circle cx="50" cy="60" r="33" fill="#4c1c5c"/>
                                <path d="M50,25 Q35,22 38,35 Q50,38 50,25 Q50,38 62,35 Q65,22 50,25" fill="#70e000"/>
                            </svg>
                        `;
                    } else {
                        buahSvg = `
                            <svg width="${size}" height="${size}" viewBox="0 0 100 100">
                                <path d="M50,12 Q55,20 48,26" stroke="#5d4037" stroke-width="3" fill="none"/>
                                <path d="M50,90 C15,90 5,70 5,45 C5,20 25,10 50,15 C75,10 95,20 95,45 C95,70 85,90 50,90 Z" fill="var(--apple-red)"/>
                            </svg>
                        `;
                    }
            
                    wrapper.innerHTML = buahSvg + `<div class="apple-name">${nama}</div>`;
                    
                    wrapper.onclick = () => {
                        const modalTitle = document.getElementById('modal-title');
                        modalTitle.style.color = selTW === "1" ? "var(--apple-red)" : selTW === "2" ? "#85933a" : selTW === "3" ? "#f9844a" : "#4c1c5c";
                        modalTitle.innerText = `Apresiasi ${namaBuah} untuk ${nama}`;
                        
                        document.getElementById('modal-content').innerHTML = treeGroups[nama].map(m => `<div class="msg-bubble" style="border-left-color:${modalTitle.style.color}">"${m.Ucapan || m.ucapan}"</div>`).join('');
                        document.getElementById('modal').style.display = 'flex';
                    };
                    layer.appendChild(wrapper);
                });
            }

        function submitApresiasi() {
            const pgr = document.getElementById('in-pengirim').value;
            const pnr = document.getElementById('in-penerima').value;
            const psn = document.getElementById('in-pesan').value;
            const stat = document.getElementById('status');

            // DEBUG: Cek isi data di console
            console.log("Cek Data Global:", { daftarKaryawan, allData });
        
            // 1. Validasi Dasar
            if(!pgr || !pnr || !psn) return alert("Mohon lengkapi semua data!");
            if(pgr === pnr) return alert("Ops! Anda tidak bisa mengirim apresiasi untuk diri sendiri. 😊");
        
           // 2. Validasi Daftar Nama (Syntax diperbaiki di sini)
           if (!daftarKaryawan.includes(pgr)) {
                console.warn("Validasi Gagal: Pengirim tidak ada di daftar.");
                return alert("Nama Pengirim tidak valid! Silakan pilih nama dari daftar.");
            }
            if (!daftarKaryawan.includes(pnr)) {
                console.warn("Validasi Gagal: Penerima tidak ada di daftar.");
                return alert("Nama Penerima tidak valid! Silakan pilih nama dari daftar.");
            }
        
            // 3. Logika Triwulan
            const currentMonth = new Date().getMonth() + 1;
            let currentTW = "1";
            if (currentMonth >= 4 && currentMonth <= 7) currentTW = "2";
            else if (currentMonth >= 8 && currentMonth <= 9) currentTW = "3";
            else if (currentMonth >= 10 && currentMonth <= 12) currentTW = "4";
        
            // 4. Cek Duplikat (Pengirim, Penerima, Pesan, DAN Triwulan sama)
            const pesanBaru = psn.toLowerCase().trim();
        
            const sudahPernah = allData.some(d => {
                const pengirimSama = (d.Pengirim || d.pengirim) === pgr;
                const penerimaSama = (d.Penerima || d.penerima) === pnr;
                
                // Cek Pesan
                const pesanLama = (d.Ucapan || d.ucapan || "").toString().toLowerCase().trim();
                const pesanSama = pesanLama === pesanBaru;
        
                // Cek Triwulan
                const tglDataLama = d.Timestamp || d.timestamp;
                const twDataLama = getQuarter(tglDataLama); 
                
                return pengirimSama && penerimaSama && pesanSama && (twDataLama === currentTW);
            });

            console.log("Hasil pengecekan duplikat:", sudahPernah);
        
            if(sudahPernah) {
                return alert(`Ops! Anda sudah pernah mengirimkan apresiasi yang sama kepada ${pnr} di Triwulan ${currentTW} ini.`);
            }
        
            // 5. Eksekusi Kirim
            stat.innerText = "⏳ Sedang menggantungkan buah apresiasi...";
            const fd = new FormData();
            fd.append('Pengirim', pgr); 
            fd.append('Penerima', pnr); 
            fd.append('Ucapan', psn);
        
            fetch(API_URL, { method: 'POST', body: fd, mode: 'no-cors' }).then(() => {
                stat.innerText = "🎉 Berhasil! Buah apresiasimu telah tergantung di pohon.";
                document.getElementById('in-pesan').value = ""; // Bersihkan pesan
                refreshData(); 
                setTimeout(() => { stat.innerText = ""; }, 3000);
                console.log("Validasi lolos, mengirim data...");
            }).catch(err => {
                alert("Terjadi kesalahan saat mengirim ke database.");
                stat.innerText = "";
            });
        }
    </script>
